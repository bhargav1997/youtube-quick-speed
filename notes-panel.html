<!-- Timestamp Notes Side Panel (Injected into YouTube pages) -->
<div id="yqs-notes-panel" style="display: none;">
    <div class="yqs-notes-header">
        <div class="yqs-notes-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path
                    d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
            </svg>
            <span id="yqs-video-title">Timestamp Notes</span>
        </div>
        <button id="yqs-close-panel" class="yqs-icon-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path
                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
        </button>
    </div>

    <div class="yqs-notes-tabs">
        <button class="yqs-tab active" data-tab="add">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            Add Note
        </button>
        <button class="yqs-tab" data-tab="list">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
            </svg>
            Notes (<span id="yqs-notes-count">0</span>)
        </button>
    </div>

    <!-- Add Note Tab -->
    <div id="yqs-tab-add" class="yqs-tab-content active">
        <div class="yqs-timestamp-display">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path
                    d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
            </svg>
            <span id="yqs-current-timestamp">00:00</span>
        </div>

        <textarea id="yqs-note-input" placeholder="Type your note here... (Press Enter to save)" rows="4"></textarea>

        <div class="yqs-tags-input">
            <input type="text" id="yqs-tag-input" placeholder="Add tags (e.g., #important #bug)">
        </div>

        <div class="yqs-note-options">
            <label class="yqs-checkbox">
                <input type="checkbox" id="yqs-pause-while-typing">
                <span>Pause while typing</span>
            </label>
        </div>

        <button id="yqs-save-note" class="yqs-primary-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
            </svg>
            Save Note
        </button>
    </div>

    <!-- Notes List Tab -->
    <div id="yqs-tab-list" class="yqs-tab-content">
        <div class="yqs-export-bar">
            <button id="yqs-export-btn" class="yqs-secondary-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path
                        d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z" />
                </svg>
                Export
            </button>
            <div id="yqs-export-menu" class="yqs-dropdown-menu" style="display: none;">
                <button data-format="txt">📄 Text (.txt)</button>
                <button data-format="md">📝 Markdown (.md)</button>
                <button data-format="json">🔧 JSON (.json)</button>
                <button data-format="copy">📋 Copy to Clipboard</button>
            </div>
        </div>

        <div id="yqs-notes-list" class="yqs-notes-list">
            <div class="yqs-empty-state">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" opacity="0.3">
                    <path
                        d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                </svg>
                <p>No notes yet</p>
                <span>Click "Add Note" to get started</span>
            </div>
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<button id="yqs-floating-note-btn" style="display: none;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
    </svg>
</button>
